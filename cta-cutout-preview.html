<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billy Cooper Law CTA Preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
        background: #f4f2ed;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      .cta {
        position: relative;
        width: min(100%, 920px);
        min-height: 430px;
        overflow: hidden;
        border-radius: 26px;
        isolation: isolate;
        background:
          linear-gradient(90deg, rgba(5, 34, 50, .98) 0%, rgba(5, 34, 50, .93) 43%, rgba(5, 34, 50, .48) 70%, rgba(5, 34, 50, .16) 100%),
          url("public/cta/car-accident-background.webp") center / cover no-repeat;
        box-shadow: 0 28px 70px rgba(7, 35, 48, .25);
      }
      .cta::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(circle at 83% 43%, rgba(218, 181, 108, .32), transparent 31%),
          linear-gradient(0deg, rgba(4, 27, 40, .42), transparent 48%);
      }
      .copy {
        position: relative;
        z-index: 2;
        width: 60%;
        padding: 58px 48px 54px;
      }
      .eyebrow {
        margin: 0 0 16px;
        color: #e0bd74;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .15em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 520px;
        margin: 0 0 17px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(38px, 5vw, 57px);
        font-weight: 400;
        line-height: .98;
        letter-spacing: -.035em;
      }
      .description {
        max-width: 480px;
        margin: 0 0 26px;
        color: rgba(255, 255, 255, .93);
        font-size: 17px;
        line-height: 1.55;
      }
      .phone {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 15px 22px;
        border-radius: 999px;
        background: #dfbd75;
        color: #09283a;
        font-size: 17px;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 10px 26px rgba(0, 0, 0, .2);
      }
      .phone::before {
        content: "☎";
        font-size: 17px;
      }
      .practice-link {
        display: inline-block;
        margin: 20px 0 0 4px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-underline-offset: 5px;
      }
      .billy {
        position: absolute;
        z-index: 1;
        right: -35px;
        bottom: -2px;
        width: min(50%, 470px);
        max-height: 440px;
        object-fit: contain;
        object-position: right bottom;
        filter: drop-shadow(-20px 16px 26px rgba(0, 0, 0, .28));
      }
      @media (max-width: 720px) {
        .cta { min-height: 620px; }
        .copy { width: 100%; padding: 38px 28px 240px; }
        h1 { max-width: 560px; font-size: 42px; }
        .billy { right: -18px; width: 300px; max-height: 310px; }
      }
    </style>
  </head>
  <body>
    <section class="cta" aria-label="Car accident consultation">
      <div class="copy">
        <p class="eyebrow">Billy Cooper Law</p>
        <h1>Injured in a Queens Car Accident?</h1>
        <p class="description">Get answers before speaking with an insurance company. Billy Cooper Law can investigate the crash, preserve evidence, and explain the deadlines that apply.</p>
        <a class="phone" href="tel:7188663311">Call (718) 866-3311</a><br />
        <a class="practice-link" href="https://www.billycooperlaw.com/car-accident-lawyer/">Learn about car accident cases</a>
      </div>
      <img class="billy" src="public/cta/billy-cooper-cutout-v4.png" alt="Billy Cooper, Esq." />
    </section>
  </body>
</html>
